name: ShipCheck example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      - run: pnpm build
      - run: node dist/cli.js scan . --format markdown
