name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Dogfood Stack Accord
        run: node dist/cli.js scan examples/healthy-stack
