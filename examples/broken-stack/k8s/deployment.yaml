apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: api
          image: example/storefront:v1
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-api
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: orphaned-api
spec:
  selector:
    app: storefron-typo
  ports:
    - port: 80
      targetPort: 3000
