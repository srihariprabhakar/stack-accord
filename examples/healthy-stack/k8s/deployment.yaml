apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: api
          image: example/storefront:v1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: storefront-database
                  key: url
            - name: PAYMENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: payments
                  key: api-key
          readinessProbe:
            httpGet:
              path: /ready
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-api
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: http
